name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'gradle.properties'
      - '**.gradle.kts'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'gradle.properties'
      - '**.gradle.kts'

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
          cache: 'gradle'

      - name: Check Theme Resources
        run: npm run check

      - name: Verify Plugin
        run: ./gradlew verifyPlugin

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Get Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload Distribution
        uses: actions/upload-artifact@v7
        with:
          name: "monokai-flat-fancy-theme-${{ steps.vars.outputs.sha_short }}"
          path: build/distributions/*.zip

      - name: Output Unreleased Changes
        run: |
          echo "# Unreleased" >> $GITHUB_STEP_SUMMARY
          echo "$(./gradlew getChangelog --unreleased --no-header --console=plain -q)" >> $GITHUB_STEP_SUMMARY
